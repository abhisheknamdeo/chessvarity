[project]
name = "dukes-king"
version = "0.3.0"
description = "Chess Varsity: a personal chess coach. It studies your games and builds practice from your own mistakes."
requires-python = ">=3.12"
dependencies = [
    "chess>=1.11.2",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
]

[project.optional-dependencies]
# PostgreSQL storage (used when DATABASE_URL is set): uv sync --extra postgres
postgres = [
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
]
# Sending email through Amazon SES (CHESSCOACH_MAIL_BACKEND=ses): uv sync --extra aws
aws = [
    "boto3>=1.35",
]
# "Continue with Apple" signs a short-lived client secret (ES256): uv sync --extra apple
apple = [
    "pyjwt[crypto]>=2.8",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[project.scripts]
chesscoach = "chesscoach.cli:main"
chesscoach-serve = "chesscoach.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chesscoach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
